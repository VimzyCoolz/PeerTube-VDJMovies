# PeerTube + PostgreSQL + Redis, ready to deploy on Coolify.
#
# Coolify provides the reverse proxy (TLS + domain routing) and injects the
# environment variables declared with ${...} below. The `peertube` service
# exposes port 9000 and Coolify routes the assigned domain to it.
#
# The production configuration is taken from
# support/docker/production/config/production.yaml and can be overridden with
# the PEERTUBE_* environment variables (see
# support/docker/production/config/custom-environment-variables.yaml).
#
# Non-Coolify usage: copy .env.example to .env, adjust it and run
#   docker compose up -d

services:
  peertube:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Ask Coolify to generate a domain for this service and route it to the
      # internal port 9000. Set your final domain in the Coolify UI.
      - SERVICE_FQDN_PEERTUBE_9000

      # --- Public instance URL -------------------------------------------------
      # PeerTube builds its public URL as "<scheme>://<hostname>:<port>", so the
      # hostname must NOT contain a port. SERVICE_FQDN_PEERTUBE_9000 carries a
      # ":9000" suffix, which would yield an invalid URL such as
      # "https://host:9000:443" and crash the server on startup. COOLIFY_FQDN is
      # the assigned domain without a port.
      - PEERTUBE_WEBSERVER_HOSTNAME=${PEERTUBE_WEBSERVER_HOSTNAME:-${COOLIFY_FQDN}}
      - PEERTUBE_WEBSERVER_HTTPS=${PEERTUBE_WEBSERVER_HTTPS:-true}
      - PEERTUBE_WEBSERVER_PORT=${PEERTUBE_WEBSERVER_PORT:-443}

      # --- Secrets (auto-generated by Coolify, editable in the UI) -------------
      - PEERTUBE_SECRET=${PEERTUBE_SECRET:-${SERVICE_HEX_64_PEERTUBE}}

      # --- Database ------------------------------------------------------------
      - PEERTUBE_DB_HOSTNAME=${PEERTUBE_DB_HOSTNAME:-postgres}
      - PEERTUBE_DB_PORT=${PEERTUBE_DB_PORT:-5432}
      - PEERTUBE_DB_NAME=${PEERTUBE_DB_NAME:-peertube}
      - PEERTUBE_DB_USERNAME=${PEERTUBE_DB_USERNAME:-peertube}
      - PEERTUBE_DB_PASSWORD=${PEERTUBE_DB_PASSWORD:-${SERVICE_PASSWORD_POSTGRES}}
      - PEERTUBE_DB_SSL=${PEERTUBE_DB_SSL:-false}

      # --- Redis ---------------------------------------------------------------
      - PEERTUBE_REDIS_HOSTNAME=${PEERTUBE_REDIS_HOSTNAME:-redis}
      - PEERTUBE_REDIS_PORT=${PEERTUBE_REDIS_PORT:-6379}

      # --- Instance ------------------------------------------------------------
      - PEERTUBE_ADMIN_EMAIL=${PEERTUBE_ADMIN_EMAIL:-admin@example.com}
      - PEERTUBE_INSTANCE_NAME=${PEERTUBE_INSTANCE_NAME:-PeerTube}
      - PEERTUBE_SIGNUP_ENABLED=${PEERTUBE_SIGNUP_ENABLED:-false}
      - PEERTUBE_LOG_LEVEL=${PEERTUBE_LOG_LEVEL:-info}
    volumes:
      - peertube-data:/data
      - peertube-config:/config
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:9000/api/v1/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PEERTUBE_DB_USERNAME:-peertube}
      - POSTGRES_PASSWORD=${PEERTUBE_DB_PASSWORD:-${SERVICE_PASSWORD_POSTGRES}}
      - POSTGRES_DB=${PEERTUBE_DB_NAME:-peertube}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  peertube-data:
  peertube-config:
  postgres-data:
  redis-data:
